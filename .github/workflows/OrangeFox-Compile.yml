name: OrangeFox - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

run-name: OrangeFox ${{ inputs.MANIFEST_BRANCH }} for ${{ inputs.DEVICE_NAME }} (${{ inputs.BUILD_TARGET }})

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '16.0'
        type: choice
        options:
        - 16.0
        - 14.1
        - 12.1
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: true
        default: 'https://github.com/MurtazaKolachi/device_xiaomi_ofox_apollo'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: 'ofox'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/apollo'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'apollo'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    permissions:
      contents: write
    env:
      ALLOW_MISSING_DEPENDENCIES: 'true'
      DEBIAN_FRONTEND: noninteractive
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Validate inputs
      env:
        MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
        DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
        DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
        DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      run: |
        set -euo pipefail
        echo "Manifest: fox_${MANIFEST_BRANCH}"
        echo "Device tree: ${DEVICE_TREE} @ ${DEVICE_TREE_BRANCH}"
        echo "Device path: ${DEVICE_PATH}"
        echo "Device: ${DEVICE_NAME}"

        # Basic sanity: DEVICE_PATH must look like device/<vendor>/<codename>
        # and must not contain '..' (path traversal).
        if [[ "${DEVICE_PATH}" == *".."* ]]; then
          echo "::error::DEVICE_PATH must not contain '..': ${DEVICE_PATH}"
          exit 1
        fi
        if [[ "${DEVICE_PATH}" != device/*/* ]]; then
          echo "::error::DEVICE_PATH should look like 'device/<vendor>/<codename>', got: ${DEVICE_PATH}"
          exit 1
        fi

        # Fail fast if the device-tree repo/branch does not exist.
        # This is the step that previously failed late with cryptic "exit code 128".
        if ! git ls-remote --heads "${DEVICE_TREE}" "${DEVICE_TREE_BRANCH}" | grep -q .; then
          echo "::error::Branch '${DEVICE_TREE_BRANCH}' not found in ${DEVICE_TREE}."
          echo "Available branches:"
          git ls-remote --heads "${DEVICE_TREE}" | awk '{print $2}' | sed 's|refs/heads/||' || true
          echo ""
          echo "Check DEVICE_TREE / DEVICE_TREE_BRANCH workflow inputs and retry."
          exit 1
        fi
        echo "Input validation passed."

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq aria2
        git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      env:
        MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        GH_ACTOR: ${{ github.actor }}
        GH_ACTOR_ID: ${{ github.actor_id }}
      run: |
        set -euo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
        cd "${GITHUB_WORKSPACE}/OrangeFox"
        git config --global user.name "${GH_ACTOR}"
        git config --global user.email "${GH_ACTOR_ID}+${GH_ACTOR}@users.noreply.github.com"
        git config --global --add safe.directory '*'
        rm -rf sync
        git clone --depth=1 https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch "${MANIFEST_BRANCH}" --path "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"

    - name: Clone Device Tree
      env:
        MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
        DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
        DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      run: |
        set -euo pipefail
        FOX_ROOT="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        if [[ ! -d "${FOX_ROOT}" ]]; then
          echo "::error::Manifest checkout not found at ${FOX_ROOT}. Set-up Manifest probably failed."
          exit 1
        fi
        cd "${FOX_ROOT}"

        # The manifest may already ship this path - a plain `git clone`
        # into an existing non-empty dir fails with exit 128, so reset it first.
        if [[ -e "${DEVICE_PATH}" ]]; then
          echo "Removing pre-existing ${DEVICE_PATH} ..."
          rm -rf "${DEVICE_PATH}"
        fi
        mkdir -p "$(dirname "${DEVICE_PATH}")"

        echo "Cloning ${DEVICE_TREE} (branch: ${DEVICE_TREE_BRANCH}) into ${DEVICE_PATH} ..."
        git clone --depth=1 --single-branch --branch "${DEVICE_TREE_BRANCH}" "${DEVICE_TREE}" "./${DEVICE_PATH}"

        cd "${DEVICE_PATH}"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
        echo "Cloned commit: $(git rev-parse HEAD)"

    - name: Patch upstream sources for new Clang
      env:
        MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      run: |
        set -euo pipefail
        # Workaround for upstream bug (OrangeFox bootable/Recovery fox_16.0):
        # openaes isaac/rand.h uses K&R-style prototypes with commented-out
        # params (void randinit(/*_ ... _*/)), which clang-r547379 rejects
        # with "too many arguments to function call", and rand.c uses matching
        # K&R definitions (void randinit(ctx, flag) + separate decl lines).
        # Convert header + source to ANSI together (verified consistent pair).
        if [[ "${MANIFEST_BRANCH}" == "16.0" ]]; then
          RAND_H="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}/bootable/recovery/openaes/src/isaac/rand.h"
          RAND_C="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}/bootable/recovery/openaes/src/isaac/rand.c"
          if [[ -f "${RAND_H}" && -f "${RAND_C}" ]]; then
            sed -i 's/^void randinit(\/\*_ randctx \*r, word flag _\*\/);/void randinit(randctx *r, word flag);/' "${RAND_H}"
            sed -i 's/^void isaac(\/\*_ randctx \*r _\*\/);/void isaac(randctx *r);/' "${RAND_H}"
            sed -i '/^void     isaac(ctx)$/{N;s/.*/void isaac(randctx *ctx)/}' "${RAND_C}"
            sed -i '/^void randinit(ctx, flag)$/{N;N;s/.*/void randinit(randctx *ctx, word flag)/}' "${RAND_C}"
            grep -n "^void randinit\|^void isaac" "${RAND_H}" "${RAND_C}"
          else
            echo "::warning::Expected openaes sources not found, skipping Clang workaround."
          fi
        else
          echo "No upstream source patches needed for fox_${MANIFEST_BRANCH}."
        fi

    - name: Building OrangeFox
      env:
        MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
        BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      run: |
        # NOTE: Do NOT use `set -u` here - AOSP build/envsetup.sh is not
        # nounset-clean (references $TOP, $ZSH_VERSION unbound) and fails
        # immediately under `set -u` with "TOP: unbound variable".
        set -eo pipefail
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        set +e +u
        set +o pipefail
        # shellcheck disable=SC1091
        source build/envsetup.sh
        set -e
        # Newer manifests (14.1+) require a release-qualified lunch combo
        # (14.1 -> ap2a per OrangeFox docs, 16.0 -> bp2a for android-16.0.0 base)
        case "${MANIFEST_BRANCH}" in
          14.1) LUNCH_RELEASE="-ap2a" ;;
          16.0) LUNCH_RELEASE="-bp2a" ;;
          *) LUNCH_RELEASE="" ;;
        esac
        lunch "twrp_${DEVICE_NAME}${LUNCH_RELEASE}-eng"
        mka adbd "${BUILD_TARGET}image"

    - name: Set Release Properties
      env:
        MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      run: |
        set -euo pipefail
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> "${GITHUB_ENV}"
        DEVICE_TREE_URL="${DEVICE_TREE}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> "${GITHUB_ENV}"

    - name: Check build outputs
      env:
        MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      run: |
        set -euo pipefail
        OUT_DIR="OrangeFox/fox_${MANIFEST_BRANCH}/out/target/product/${DEVICE_NAME}"
        echo "Listing ${OUT_DIR} ..."
        ls -lh "${OUT_DIR}" || { echo "::error::Output directory not found: ${OUT_DIR}"; exit 1; }
        if ! compgen -G "${OUT_DIR}/OrangeFox*.img" > /dev/null && ! compgen -G "${OUT_DIR}/OrangeFox*.zip" > /dev/null; then
          echo "::error::No OrangeFox*.img or OrangeFox*.zip found in ${OUT_DIR} - build probably failed."
          exit 1
        fi

    - name: Tag artifacts with manifest branch
      env:
        MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      run: |
        set -euo pipefail
        # Upstream always emits OrangeFox-R<rel>-... (R = OrangeFox release,
        # not Android). Suffix the manifest branch so 12.1/14.1/16.0 builds
        # are distinguishable, e.g. OrangeFox-R12.0-fox16.0-Unofficial-apollon.img
        OUT_DIR="OrangeFox/fox_${MANIFEST_BRANCH}/out/target/product/${DEVICE_NAME}"
        for f in "${OUT_DIR}"/OrangeFox-R*-"${DEVICE_NAME}".img "${OUT_DIR}"/OrangeFox-R*-"${DEVICE_NAME}".zip; do
          [[ -e "$f" ]] || continue
          new="$(echo "$f" | sed -E "s/(OrangeFox-R[0-9.]+)-/\1-fox${MANIFEST_BRANCH}-/")"
          if [[ "$f" != "$new" ]]; then
            echo "Renaming $(basename "$f") -> $(basename "$new")"
            mv "$f" "$new"
          fi
        done
        ls -lh "${OUT_DIR}"/OrangeFox* 2>/dev/null | head

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        fail_on_unmatched_files: true
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
